[project]
name = "quakemesh"
version = "1.0.1"
requires-python = ">=3.10"
description = "Experimental cloud-native geographically diverse motion corroboration prototype"

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"

[tool.ruff]
line-length=140
target-version="py310"
exclude=[".venv",".venv-cdk","android","artifacts","cdk.out"]

[tool.ruff.lint]
select=["E9","F63","F7","F82"]
